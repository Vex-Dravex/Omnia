[package]
name = "omnia-agent"
version = "0.1.0"
edition = "2021"
description = "Guest-side control daemon for Omnia (see docs/protocols/agent.proto and milestones/M1-linux-runtime.md)"
publish = false

[lib]
name = "omnia_agent"
path = "src/lib.rs"

[[bin]]
name = "omnia-agent"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "fs", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
async-stream = "0.3"
nix = { version = "0.29", features = ["term", "process", "fs", "mount", "poll"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
tower = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.5"
